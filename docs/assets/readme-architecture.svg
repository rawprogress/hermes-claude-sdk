  <text x="76" y="260" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#AEB8CC">claude_status</text>
  <rect x="252" y="240" width="176" height="30" rx="6" fill="#141B26" stroke="#222B3A"/>
  <text x="264" y="260" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#AEB8CC">claude_events</text>
  <rect x="64" y="278" width="176" height="30" rx="6" fill="#141B26" stroke="#222B3A"/>
  <text x="76" y="298" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#AEB8CC">claude_list</text>
  <rect x="252" y="278" width="176" height="30" rx="6" fill="#141B26" stroke="#222B3A"/>
  <text x="264" y="298" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#AEB8CC">claude_stop</text>
