name: hermes-claude-sdk
version: 0.2.0
description: "Drive Claude Code on the Mac from Hermes. Seven tools start, steer, inspect, stop and resume Claude Agent SDK runs over ssh; Claude does the coding, tests, lint, typecheck, build and reviews."
author: Katso & rawprogress
kind: standalone
manifest_version: 2
api_version: 1
license: MIT
tags:
  - claude
  - orchestration
  - remote
provides_tools:
  - claude_start
  - claude_send
  - claude_status
  - claude_events
  - claude_list
  - claude_stop
  - claude_resume
python_dependencies: []
config_schema:
  ssh_host:
    type: string
    default: macbook
    description: "ssh destination of the Mac running hermes-claude-runner."
  remote_command:
    type: string
    default: ~/.local/bin/hermes-claude-runner
    description: >-
      The runner wrapper on the Mac; 'rpc' is appended. Either home-relative
      (~/...), which the Mac's login shell expands, or an absolute path.
  timeout_seconds:
    type: integer
    default: 240
    description: >-
      Seconds to wait for one ssh round trip before failing. Values below 240
      are raised to that floor: the runner creates the git worktree inline, so
      a shorter wait would report ssh_timeout for a run that really started.
