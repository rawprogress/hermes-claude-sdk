  <rect x="764" y="254" width="372" height="58" rx="8" fill="#10151E" stroke="#222B3A"/>
  <text x="782" y="278" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#E3E8F2">one worker per run</text>
  <text x="782" y="298" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#6E7889">spawned detached · pid recorded and proven</text>
  <path d="M944 316 L956 324 L968 316 Z" fill="#2E3848"/>
  <rect x="764" y="328" width="372" height="58" rx="8" fill="#10151E" stroke="#222B3A"/>
  <text x="782" y="352" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#E3E8F2">ClaudeSDKClient → claude CLI</text>
  <text x="782" y="372" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#6E7889">runs unattended · loads your Claude settings</text>
  <path d="M944 390 L956 398 L968 390 Z" fill="#2E3848"/>
  <rect x="764" y="402" width="372" height="58" rx="8" fill="#10151E" stroke="#222B3A"/>
  <text x="782" y="426" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#E3E8F2">git worktree</text>
  <text x="782" y="446" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#6E7889">branch hermes/&lt;short-run-id&gt; · not your checkout</text>

