<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640"
     role="img" aria-labelledby="archTitle archDesc">
  <title id="archTitle">hermes-claude-sdk architecture: Hermes host, one JSON envelope, your Mac</title>
  <desc id="archDesc">On the left, the Hermes host holds one plugin providing seven tools:
    claude_start, claude_send, claude_status, claude_events, claude_list, claude_stop and
    claude_resume, with the bundled skill claude-code-orchestration beside them. The plugin
    uses the standard library only and holds no state. In the middle, one JSON object travels
    over a fixed argv — ssh dash o BatchMode equals yes, the host, the runner, and rpc — and
    one JSON envelope comes back, always either ok true with a result or ok false with a stable
    error code. With transport set to local the same argv runs without the ssh hop. On the
    right, the Mac runs a LaunchAgent daemon that owns runs and reconciles lost workers every
    30 seconds, spawns one detached worker per run, drives the Claude CLI through
    ClaudeSDKClient, and works inside a git worktree on branch hermes slash short run id,
    leaving your own checkout untouched. Along the bottom, the run lifecycle goes queued,
    preparing, working, then completed, blocked, failed, stopped or unknown; unknown is never
    reported as success.</desc>

  <defs>
    <linearGradient id="archBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0E14"/>
      <stop offset="1" stop-color="#111722"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="1198" height="638" rx="16" fill="url(#archBg)" stroke="#212938"/>

