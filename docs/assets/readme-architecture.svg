  <text x="600" y="410" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#7AA2F7">transport: local</text>
  <text x="600" y="430" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#5F6979">same fixed argv, no ssh hop</text>

  <rect x="740" y="88" width="420" height="380" rx="12" fill="#0E131B" stroke="#1E2532"/>
  <text x="764" y="126" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#E9EDF5">your Mac</text>
  <text x="764" y="147" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#6E7889">macOS · Apple Silicon or Intel</text>
  <line x1="764" y1="166" x2="1136" y2="166" stroke="#1E2532"/>
  <rect x="764" y="180" width="372" height="58" rx="8" fill="#10151E" stroke="#222B3A"/>
